name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Fixture evals
        run: bun evals/score.ts
      - name: Live evals (skip if no backend)
        run: bun evals/live.ts
      - name: CLI smoke
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js doctor || true
          npx --yes . doctor || node dist/cli.js doctor || true
