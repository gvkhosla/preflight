<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>og</title>
<link rel="stylesheet" href="fonts.css"/>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; background: #000;
  }
  body {
    font-family: "Geist", ui-sans-serif, system-ui, sans-serif;
    color: #ededed; -webkit-font-smoothing: antialiased;
  }
  .frame {
    position: relative;
    width: 1200px; height: 630px;
    padding: 48px 64px;
    background:
      radial-gradient(800px 380px at 88% -5%, rgba(255,255,255,.05), transparent 55%),
      #000;
  }
  .top {
    position: absolute; top: 48px; left: 64px;
    display: flex; align-items: center; gap: 12px;
    color: #8a8a8a; font-size: 22px; font-weight: 500; letter-spacing: -0.02em;
  }
  .dot {
    width: 28px; height: 28px; border-radius: 8px; background: #fff; color: #000;
    display: grid; place-items: center; font-weight: 700; font-size: 14px;
  }
  .copy {
    position: absolute; left: 64px; top: 190px; right: 64px;
  }
  h1 {
    margin: 0; font-size: 78px; line-height: 0.98; letter-spacing: -0.05em; font-weight: 600;
  }
  .sub {
    margin-top: 20px; color: #888; font-size: 24px; letter-spacing: -0.02em;
  }
  .chip {
    position: absolute; left: 64px; bottom: 48px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 20px; font-weight: 500;
    background: #fff; color: #000;
    border-radius: 999px; padding: 14px 22px;
  }
  .meta {
    position: absolute; right: 64px; bottom: 62px;
    color: #666; font-family: "Geist Mono", ui-monospace, monospace; font-size: 16px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top"><div class="dot">P</div> preflight</div>
    <div class="copy">
      <h1>Ship what you<br/>meant to ship.</h1>
      <div class="sub">Multi-judge findings · @pierre/diffs · executable verdicts</div>
    </div>
    <div class="chip">npm i -g @khosla/preflight</div>
    <div class="meta">local-first ship gate</div>
  </div>
</body>
</html>
