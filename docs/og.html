<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>preflight</title>
<link rel="stylesheet" href="fonts.css"/>
<style>
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; background: #080908; }
  body { color: #f4f3ee; font-family: "Geist", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .frame { position: relative; width: 1200px; height: 630px; padding: 50px 58px; background: #080908; }
  .rule { position: absolute; top: 102px; right: 58px; left: 58px; height: 1px; background: rgba(244,243,238,.10); }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 580; letter-spacing: -.03em; }
  .mark { position: relative; width: 28px; height: 28px; border: 1px solid rgba(244,243,238,.18); border-radius: 7px; }
  .mark:before, .mark:after { position: absolute; left: 7px; width: 12px; height: 3px; border-radius: 2px; background: #f4f3ee; content: ""; }
  .mark:before { top: 8px; }
  .mark:after { top: 16px; background: #9de8bf; }
  .copy { position: absolute; top: 174px; left: 58px; }
  .eyebrow { margin: 0 0 22px; color: #91908a; font: 500 16px "Geist Mono", monospace; letter-spacing: .09em; text-transform: uppercase; }
  .eyebrow:before { display: inline-block; width: 8px; height: 8px; margin-right: 12px; border-radius: 50%; background: #9de8bf; content: ""; }
  h1 { max-width: 800px; margin: 0; font-size: 78px; font-weight: 560; letter-spacing: -.055em; line-height: .98; }
  .command { position: absolute; right: 58px; bottom: 50px; left: 58px; display: flex; height: 70px; align-items: center; gap: 16px; border: 1px solid rgba(244,243,238,.12); border-radius: 10px; background: #0d0e0d; padding: 0 20px; font: 500 20px "Geist Mono", monospace; }
  .prompt { color: #9de8bf; }
  .status { margin-left: auto; border: 1px solid rgba(157,232,191,.25); border-radius: 6px; padding: 8px 12px; color: #9de8bf; font-size: 16px; }
</style>
</head>
<body>
<div class="frame">
  <div class="brand"><span class="mark"></span><span>preflight</span></div>
  <div class="rule"></div>
  <div class="copy">
    <p class="eyebrow">Local ship gate for coding agents</p>
    <h1>One last check<br/>before you ship.</h1>
  </div>
  <div class="command"><span class="prompt">›</span><span>npx @khosla/preflight</span><span class="status">no account needed</span></div>
</div>
</body>
</html>
